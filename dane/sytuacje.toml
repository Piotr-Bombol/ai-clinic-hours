# Sytuacje, z którymi lider przychodzi na rozmowę.
# Każda sytuacja jest prawdziwa: wzór powtarza się w rozmowach z klientami Constans
# (źródła w polu "zrodlo", nie trafiają na stronę). Na stronie nie ma nazw firm ani cytatów z nagrań.
# Liczby i nazwy narzędzi w cytatach są przykładowe: mają sprawić, że sytuacja brzmi konkretnie. Wzór pochodzi ze źródeł.
#
# Pola:
#   id          krótki identyfikator (litery, cyfry, myślniki), używany w linkach
#   etykieta    2-4 słowa na chipie i nad cytatem
#   cytat       pierwsza osoba, tak jak lider powiedziałby to przy kawie; bez form zdradzających płeć
#   obszar      strategia | technologia | adopcja
#   wyjdziesz   2-4 rzeczy, które realnie mieszczą się w notatce po 60 minutach
#   notatka     (opcjonalnie) przykładowa notatka: pięć punktów; pierwsze trzy sytuacje z notatką idą do animacji w hero
#   [[sytuacja.kto]]  kolejno: pierwsza osoba (dlaczego), druga osoba (kiedy)

